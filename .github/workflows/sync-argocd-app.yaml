name: Sync ArgoCD App

on:
  workflow_call:
    inputs:
      argocd_app_name:
        description: "Tên ArgoCD Application cần sync"
        required: true
        type: string
      deployment_name:
        description: "Tên Deployment cần chờ Healthy sau khi sync"
        required: true
        type: string
      argocd_server:
        description: "Địa chỉ ArgoCD server (host:port)"
        required: false
        type: string
        default: argocd-server.argocd.svc.cluster.local:80
      timeout:
        description: "Thời gian tối đa (giây) chờ Deployment Healthy"
        required: false
        type: string
        default: "120"
      retry_count:
        description: "Số lần retry mỗi lệnh argocd CLI khi thất bại"
        required: false
        type: string
        default: "3"
      retry_interval:
        description: "Thời gian (giây) chờ giữa các lần retry"
        required: false
        type: string
        default: "10"
    secrets:
      ARGOCD_AUTH_TOKEN:
        required: true

jobs:
  sync_argocd_app:
    runs-on: github-runner-k8s
    env:
      ARGOCD_SERVER: ${{ inputs.argocd_server }}
      ARGOCD_AUTH_TOKEN: ${{ secrets.ARGOCD_AUTH_TOKEN }}
      ARGOCD_APP_NAME: ${{ inputs.argocd_app_name }}
      DEPLOYMENT_NAME: ${{ inputs.deployment_name }}
      RETRY_COUNT: ${{ inputs.retry_count }}
      RETRY_INTERVAL: ${{ inputs.retry_interval }}
    steps:
      - name: List app
        run: |
          # Retry wrapper: chống trường hợp ArgoCD server tạm thời không sẵn sàng
          retry() {
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$RETRY_COUNT" ]; then
                echo "Lệnh thất bại sau $attempt lần thử: $*"
                return 1
              fi
              echo "Lệnh thất bại (lần $attempt/$RETRY_COUNT), thử lại sau ${RETRY_INTERVAL}s..."
              attempt=$((attempt + 1))
              sleep "$RETRY_INTERVAL"
            done
          }

          echo "Check argocd app list..."
          retry argocd app list \
          --server "$ARGOCD_SERVER" \
          --auth-token "$ARGOCD_AUTH_TOKEN" \
          --plaintext

      - name: Sync app and wait for Deployment to be Healthy
        run: |
          retry() {
            local attempt=1
            until "$@"; do
              if [ "$attempt" -ge "$RETRY_COUNT" ]; then
                echo "Lệnh thất bại sau $attempt lần thử: $*"
                return 1
              fi
              echo "Lệnh thất bại (lần $attempt/$RETRY_COUNT), thử lại sau ${RETRY_INTERVAL}s..."
              attempt=$((attempt + 1))
              sleep "$RETRY_INTERVAL"
            done
          }

          echo "Syncing ArgoCD application '$ARGOCD_APP_NAME'..."
          retry argocd app sync $ARGOCD_APP_NAME --async \
              --server "$ARGOCD_SERVER" \
              --auth-token "$ARGOCD_AUTH_TOKEN" \
              --plaintext

          echo "Check Deployment status '$DEPLOYMENT_NAME' within ${{ inputs.timeout }}s..."
          if retry argocd app wait $ARGOCD_APP_NAME \
              --server "$ARGOCD_SERVER" \
              --auth-token "$ARGOCD_AUTH_TOKEN" \
              --plaintext \
              --resource apps:Deployment:$DEPLOYMENT_NAME \
              --health \
              --timeout ${{ inputs.timeout }}; then

              echo "Success: Deployment $DEPLOYMENT_NAME is HEALTHY!"
              exit 0
          else
              echo "Failure: Deployment $DEPLOYMENT_NAME did not reach Healthy status within ${{ inputs.timeout }}s."
              exit 1
          fi
